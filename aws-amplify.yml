version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e REACT_APP_ALLOWED_ORIGINS >> .env.production
        - env | grep -e REACT_APP_MONGODB_DB >> .env.production
        - env | grep -e REACT_APP_MONGODB_URI >> .env.production
        - env | grep -e REACT_APP_TRUST_PROXY_HEADERS >> .env.production
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*